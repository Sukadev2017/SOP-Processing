application:
  name: "SOP GenAI Migration Platform"
  version: "6.0"

llm:
  provider: "ollama"

  temperature: 0.0

  # Keep responses relatively small.
  max_tokens: 2048

  # Local inference can be slower on CPU.
  timeout: 600

  # Protect a small SLM from oversized prompts.
  max_input_chars: 24000

  ollama:
    model: "qwen3:4b-instruct-2507-q4_K_M"
    base_url: "http://localhost:11434"

    # Keep model resident between section calls.
    keep_alive: "10m"

    # Ollama context allocation.
    num_ctx: 16384

  huggingface:
    model: "zai-org/GLM-5.2"
    inference_provider: "zai-org"
    api_key_env: "HF_TOKEN"

  openai:
    model: "YOUR_OPENAI_MODEL"
    api_key_env: "OPENAI_API_KEY"
    base_url: null

  anthropic:
    model: "YOUR_ANTHROPIC_MODEL"
    api_key_env: "ANTHROPIC_API_KEY"


extraction:

  pdf:

    progress: true

    tables:
      enabled: true

    ocr:
      enabled: true
      dpi: 200
      minimum_native_characters: 40
      minimum_confidence: 40


template:

  heading:

    max_level: 6

    numbered_heading_regex: '^\\s*(\\d+(?:\\.\\d+)*)[\\s\\.\\-]+(.+)$'

    uppercase_short_heading_max_chars: 120


semantic_enrichment:

  # Prevent sending the whole SOP to the SLM.
  batch_size: 30

  # Second protection against very large batches.
  max_batch_chars: 18000


embedding:

  model: "sentence-transformers/all-MiniLM-L6-v2"

  normalize_embeddings: true


retrieval:

  # Only the best evidence reaches the SLM.
  top_k: 6

  candidate_multiplier: 3

  vector_weight: 0.45

  keyword_weight: 0.35

  authority_weight: 0.20


generation:

  # Additional guard on evidence sent to each section call.
  evidence_per_section: 6

  human_review_required: true

  unsupported_state: "SME_REQUIRED"


authority:

  POLICY: 100
  ORGANIZATIONAL_STANDARD: 90
  ARCHITECTURE_STANDARD: 80
  APPROVED_SOP: 70
  PROCESS_GUIDELINE: 60
  GUIDANCE: 60
  SOP: 50
  HISTORICAL_SOP: 30
  UNKNOWN: 0
