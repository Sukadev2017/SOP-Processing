template:

  font:
    family: "Arial"

  preserve:
    first_page: true
    header: true
    footer: true
    template_format: true
    controlled_text: true

  toc:
    automatic: true

  top_level_sections:
    allow_new: false


sections:

  - id: "1"
    title: "PURPOSE"
    required: true

  - id: "2"
    title: "APPLICABILITY"
    required: true

  - id: "3"
    title: "DEFINITIONS & ABBREVIATIONS"
    required: true

  - id: "4"
    title: "IMPLEMENTATION AND/OR PRE-REQUISITES"
    required: true

  - id: "5"
    title: "ROLES & RESPONSIBILITIES"
    required: true

  - id: "6"
    title: "PROCESS"
    required: true
    allow_subsections: true

  - id: "7"
    title: "ASSOCIATED DOCUMENTS"
    required: true

  - id: "8"
    title: "REFERENCES"
    required: true

  - id: "9"
    title: "DISTRIBUTION OF CONTROLLED PRINTS/COPIES"
    required: false

  - id: "10"
    title: "DOCUMENT HISTORY"
    required: true


infographics:

  EXECUTIVE_SUMMARY:
    color: "#D2F2F7"

  EXPLANATION:
    color: "#00E47C"

  ATTENTION:
    color: "#F5CDB9"

  KEY_TAKEAWAY:
    color: "#FBF9AA"


writing:

  active_voice: true

  mandatory_word: "must"

  recommendation_word: "should"

  avoid:
    - "please"

  preferred_replacements:

    ensure:
      - "confirm"
      - "verify"


generation_states:

  - "SOURCE_SUPPORTED"

  - "REFERENCE_DERIVED"

  - "CONFLICT"

  - "SME_REQUIRED"


ai:

  human_review_required: true

  provenance_required: true

  unsupported_content: "SME_REQUIRED"
